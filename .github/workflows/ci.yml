name: CI — Test & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff==0.4.8

      - name: Run ruff linter
        run: ruff check src/ config/ tests/ app/

      - name: Run ruff formatter check
        run: ruff format --check src/ config/ tests/ app/

  test:
    name: Unit & API Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests (no model required)
        run: |
          pytest tests/unit/ tests/model/ tests/api/ -v \
            --tb=short \
            -m "not requires_model" \
            --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  build-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t credit-risk-predictor:ci .

      - name: Verify image starts
        run: |
          docker run -d --name test-container \
            -p 8000:8000 \
            credit-risk-predictor:ci
          sleep 5
          # Health endpoint returns 200 even without model (status=degraded)
          curl -f http://localhost:8000/health || exit 1
          docker stop test-container
          docker rm test-container
